  <style>/* ============================================================
   edumerge Copilot — design tokens & styles
   Color reference: edumerge parent app
   ============================================================ */
:root {
  /* Brand palette — edumerge logo (ONLY these two hues) */
  --navy: #000098;
  --navy-deep: #00007A;
  --orange: #FC9C00;
  --orange-deep: #E08300;
  --blue: #000098;
  --blue-deep: #00007A;
  /* legacy semantic names mapped onto the two brand hues */
  --green: #000098;
  --purple: #000098;
  --amber: #E08300;
  --teal: #000098;

  /* Tweakable accent — defaults to edumerge NAVY (logo primary) */
  --accent: #000098;
  --accent-deep: #00007A;
  --accent-soft: #E4E4F7;

  /* Surfaces (light theme) — clean neutrals with a faint navy cast */
  --peach: #E8E8F6;
  --peach-lift: #F2F2FB;
  --canvas: #F7F7FC;
  --surface: #FFFFFF;
  --surface-2: #EFEFF7;
  --line: #E5E5F0;
  --line-strong: #D4D4E6;

  /* Text */
  --ink: #16162E;
  --ink-2: #565676;
  --ink-3: #8A8AA6;

  /* Tile fills (soft) — navy family or orange family only */
  --tint-orange: #FFF0D6;
  --tint-blue: #E1E1F6;
  --tint-green: #E1E1F6;
  --tint-purple: #E1E1F6;
  --tint-amber: #FFF0D6;
  --tint-teal: #E1E1F6;
  --tint-red: #FFE3CC;

  --tile-orange: #FC9C00;
  --tile-blue: #000098;
  --tile-green: #000098;
  --tile-purple: #000098;
  --tile-amber: #E08300;
  --tile-teal: #000098;
  --tile-red: #E08300;

  /* Geometry (tweakable) */
  --bubble-radius: 20px;
  --card-radius: 18px;

  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;

  --shadow-sm: 0 1px 2px rgba(27,27,31,0.05), 0 1px 3px rgba(27,27,31,0.04);
  --shadow-md: 0 4px 14px rgba(27,27,31,0.07), 0 1px 3px rgba(27,27,31,0.05);
  --shadow-lg: 0 18px 50px rgba(27,27,31,0.16), 0 4px 12px rgba(27,27,31,0.08);
}

[data-theme="dark"] {
  --peach: #12123A;
  --peach-lift: #16164A;
  --canvas: #0B0B1A;
  --surface: #15152C;
  --surface-2: #1C1C3A;
  --line: #26264A;
  --line-strong: #303056;
  --ink: #ECECF8;
  --ink-2: #AEAECB;
  --ink-3: #7E7EA0;
  --accent: #6E6EE8;
  --accent-deep: #5252D8;
  --accent-soft: #1C1C50;

  --tile-blue: #6E6EE8; --tile-green: #6E6EE8; --tile-purple: #6E6EE8; --tile-teal: #6E6EE8;
  --tint-orange: #3A2A0C;
  --tint-blue: #1C1C50;
  --tint-green: #1C1C50;
  --tint-purple: #1C1C50;
  --tint-amber: #3A2A0C;
  --tint-teal: #1C1C50;
  --tint-red: #3A2208;
  --shadow-lg: 0 18px 50px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.35);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  background:
    radial-gradient(120% 80% at 0% 0%, #ebebf8 0%, transparent 50%),
    radial-gradient(120% 90% at 100% 0%, #fdf1d9 0%, transparent 55%),
    linear-gradient(180deg, #ececf4 0%, #e4e4ee 100%);
  min-height: 100vh;
  color: var(--ink);
}

/* ---------- Page scaffold ---------- */
.page {
  max-width: 1500px;
  margin: 0 auto;
  padding: 56px 40px 96px;
}
.page-head { margin-bottom: 8px; }
.page-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent-deep);
  background: #fff; border: 1px solid var(--line-strong);
  padding: 7px 13px; border-radius: 999px; box-shadow: var(--shadow-sm);
}
.page-title {
  font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: #20262f;
  margin: 18px 0 8px;
}
.page-sub { font-size: 16px; color: #56606e; max-width: 760px; line-height: 1.5; }

.variants {
  display: flex; flex-wrap: wrap; gap: 64px 56px;
  margin-top: 52px; align-items: flex-start; justify-content: center;
}
.variant { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.variant-label {
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
}
.variant-num {
  width: 30px; height: 30px; border-radius: 999px; background: #20262f; color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 14px;
}
.variant-name { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; color: #20262f; }
.variant-desc { font-size: 13.5px; color: #687283; max-width: 420px; line-height: 1.45; }

/* ============================================================
   PHONE FRAME
   ============================================================ */
.phone {
  width: 390px; height: 818px;
  background: #0c0d10; border-radius: 54px; padding: 11px;
  box-shadow: var(--shadow-lg), inset 0 0 0 2px #2a2c31;
  position: relative; flex: none;
}
.phone-screen {
  width: 100%; height: 100%; border-radius: 44px; overflow: hidden;
  background: var(--canvas); position: relative; display: flex; flex-direction: column;
}
.dynamic-island {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 50;
}

/* ============================================================
   ASSISTANT — shared chat shell
   ============================================================ */
.asst {
  display: flex; flex-direction: column; height: 100%;
  background: var(--canvas); position: relative; min-height: 0;
}

/* Header */
.asst-head {
  flex: none; padding: 0 16px;
  background: linear-gradient(180deg, var(--peach) 0%, var(--peach-lift) 100%);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 20;
}
.asst-head.web { background: var(--surface); }
.statusbar {
  height: 54px; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 6px 4px; font-weight: 700; font-size: 15px; color: var(--ink);
}
.statusbar .sb-right { display: flex; align-items: center; gap: 7px; }
.asst-bar {
  display: flex; align-items: center; gap: 12px; padding: 10px 4px 16px;
}
.asst-bar .icon-btn { color: var(--ink); }
.asst-id { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; }
.asst-avatar {
  width: 42px; height: 42px; border-radius: 13px; flex: none;
  background: linear-gradient(150deg, var(--accent), var(--accent-deep));
  display: grid; place-items: center; color: #fff;
  box-shadow: 0 6px 16px -4px var(--accent);
}
.asst-avatar.sm { width: 34px; height: 34px; border-radius: 11px; }
.asst-meta { min-width: 0; }
.asst-name {
  font-size: 17px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink);
  display: flex; align-items: center; gap: 6px;
}
.asst-name .badge-ai {
  font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent-deep); background: var(--accent-soft);
  padding: 2px 6px; border-radius: 5px;
}
.asst-status {
  font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; margin-top: 1px;
}
.dot-live { width: 7px; height: 7px; border-radius: 999px; background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
/* connectivity status — real green / red signal */
.conn-dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.conn-dot.on { background: #1FAD55; box-shadow: 0 0 0 3px rgba(31,173,85,0.20); }
.conn-dot.off { background: #E23B3B; box-shadow: 0 0 0 3px rgba(226,59,59,0.20); animation: connblink 1.1s infinite; }
@keyframes connblink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.icon-btn {
  width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: grid; place-items: center; color: var(--ink-2);
  background: transparent; border: none; cursor: pointer; transition: background .15s, transform .1s;
}
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn.bordered { background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow-sm); }

/* Scroll area */
.asst-scroll {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
  padding: 18px 16px 8px; scroll-behavior: smooth;
}
.asst-scroll::-webkit-scrollbar { width: 0; }

/* ---------- Welcome / empty state ---------- */
.welcome { padding: 14px 2px 6px; }
.welcome-mark {
  width: 58px; height: 58px; border-radius: 18px;
  background: linear-gradient(150deg, var(--accent), var(--accent-deep));
  display: grid; place-items: center; color: #fff; margin-bottom: 18px;
  box-shadow: 0 10px 24px -8px var(--accent);
}
.welcome-h {
  font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.18; color: var(--ink);
}
.welcome-h em { font-style: normal; color: var(--accent-deep); }
.welcome-p { font-size: 14.5px; line-height: 1.5; color: var(--ink-2); margin-top: 10px; max-width: 40ch; }

.cap-label {
  font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-3); margin: 26px 2px 12px;
}
.role-chip {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
  font-size: 12px; font-weight: 700; color: var(--accent-deep);
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
  padding: 7px 13px; border-radius: 999px;
}
.caps { display: grid; gap: 10px; }

/* compact tile grid (new-chat welcome) */
.tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 14px; cursor: pointer; transition: transform .12s, box-shadow .15s, border-color .15s; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 4px; }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--line-strong); }
.tile:active { transform: translateY(0) scale(0.99); }
.tile-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 6px; }
.tile-t { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.tile-d { font-size: 11.5px; color: var(--ink-2); line-height: 1.4; }

/* recent mini-list on welcome */
.recent-mini { display: flex; flex-direction: column; gap: 6px; }
.recent-row { display: flex; align-items: center; gap: 11px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; cursor: pointer; transition: background .15s, border-color .15s; box-shadow: var(--shadow-sm); }
.recent-row:hover { border-color: var(--line-strong); background: var(--surface-2); }
.rr-ic { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
.recent-row:hover .rr-ic { background: var(--accent-soft); color: var(--accent-deep); }
.rr-t { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap {
  display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 15px;
  padding: 13px 14px; cursor: pointer; transition: transform .12s, box-shadow .15s, border-color .15s;
  box-shadow: var(--shadow-sm);
}
.cap:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--line-strong); }
.cap:active { transform: translateY(0) scale(0.99); }
.cap-ico { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; }
.cap-tx { min-width: 0; flex: 1; }
.cap-t { font-size: 14.5px; font-weight: 700; color: var(--ink); }
.cap-d { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; line-height: 1.35; }
.cap-arrow { color: var(--ink-3); flex: none; }

/* ---------- Messages ---------- */
.day-sep { display: flex; align-items: center; justify-content: center; margin: 6px 0 16px; }
.day-sep span {
  font-size: 11px; font-weight: 700; color: var(--ink-3);
  background: var(--surface-2); padding: 4px 12px; border-radius: 999px;
}
.row { display: flex; margin-bottom: 14px; gap: 9px; }
@media (prefers-reduced-motion: no-preference) {
  .row { animation: rise .32s cubic-bezier(.2,.7,.3,1) both; }
}
.row.user { justify-content: flex-end; }
.row.bot { justify-content: flex-start; }
.row-avatar {
  width: 30px; height: 30px; border-radius: 9px; flex: none; align-self: flex-end;
  background: linear-gradient(150deg, var(--accent), var(--accent-deep));
  display: grid; place-items: center; color: #fff;
}
.bubble-wrap { max-width: 80%; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.row.user .bubble-wrap { align-items: flex-end; }
.bubble {
  font-size: 14.5px; line-height: 1.5; padding: 11px 14px;
  border-radius: var(--bubble-radius); position: relative; word-wrap: break-word;
}
.bubble.bot {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-bottom-left-radius: 7px; box-shadow: var(--shadow-sm);
}
.bubble.user {
  background: linear-gradient(160deg, var(--accent), var(--accent-deep)); color: #fff;
  border-bottom-right-radius: 7px;
}
.bubble strong { font-weight: 700; }
.bubble.bot strong { color: var(--ink); }
.bubble-time { font-size: 10.5px; color: var(--ink-3); padding: 0 4px; }
.row.user .bubble-time { color: var(--ink-3); }

/* Typing */
.typing { display: inline-flex; align-items: center; gap: 5px; padding: 14px 16px; }
.typing i {
  width: 7px; height: 7px; border-radius: 999px; background: var(--ink-3);
  animation: blink 1.2s infinite both;
}
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }

/* ============================================================
   RICH CARDS
   ============================================================ */
.rcards { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.rcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--card-radius);
  overflow: hidden; box-shadow: var(--shadow-sm);
}
.rcard-head {
  display: flex; align-items: center; gap: 11px; padding: 13px 14px;
}
.rcard-ico { width: 38px; height: 38px; border-radius: 11px; flex: none; display: grid; place-items: center; }
.rcard-h { flex: 1; min-width: 0; }
.rcard-kicker {
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
}
.rcard-title { font-size: 15px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; margin-top: 1px; }
.rcard-pill {
  font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 999px; flex: none;
}
.pill-up { color: var(--green); background: var(--tint-green); }
.pill-down { color: var(--tile-red); background: var(--tint-red); }
.pill-warn { color: var(--amber); background: var(--tint-amber); }

.rcard-body { padding: 0 14px 14px; }
.rcard-line { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.rcard-line strong { color: var(--ink); font-weight: 700; }

/* Stat */
.stat-big { display: flex; align-items: baseline; gap: 10px; padding: 4px 14px 6px; }
.stat-num { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
.stat-delta { font-size: 13px; font-weight: 800; }
.stat-delta.up { color: var(--green); }
.stat-delta.down { color: var(--tile-red); }
.stat-sub { font-size: 12.5px; color: var(--ink-2); padding: 0 14px 14px; }

/* metric grid */
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.metric { background: var(--surface); padding: 12px 14px; }
.metric-k { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.metric-v { font-size: 19px; font-weight: 800; color: var(--ink); margin-top: 3px; }
.metric-v small { font-size: 12px; font-weight: 700; color: var(--ink-2); }

/* progress / attendance bar */
.prog { height: 9px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 8px 0 4px; }
.prog > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-deep)); }
.prog.green > span { background: linear-gradient(90deg, #3a3ad0, var(--navy)); }
.prog.red > span { background: linear-gradient(90deg, #ffb733, var(--orange-deep)); }

/* list rows (e.g. flagged students) */
.lrow { display: flex; align-items: center; gap: 11px; padding: 11px 14px; border-top: 1px solid var(--line); }
.lrow:first-child { border-top: none; }
.lrow-ava { width: 32px; height: 32px; border-radius: 9px; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; }
.lrow-tx { flex: 1; min-width: 0; }
.lrow-name { font-size: 13.5px; font-weight: 700; color: var(--ink); }
.lrow-sub { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }
.lrow-val { font-size: 13.5px; font-weight: 800; flex: none; }

/* card actions */
.rcard-acts { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--surface-2); }
.act {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 13px; font-weight: 700; padding: 10px 12px; border-radius: 11px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  transition: transform .1s, box-shadow .15s, background .15s;
}
.act:hover { box-shadow: var(--shadow-sm); }
.act:active { transform: scale(0.97); }
.act.primary { background: linear-gradient(160deg, var(--accent), var(--accent-deep)); color: #fff; border-color: transparent; box-shadow: 0 6px 14px -6px var(--accent); }
.act.primary:hover { filter: brightness(1.04); }

/* ── kv (key / value) ── */
.kv { padding: 4px 14px 12px; }
.kv-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); }
.kv-row:first-child { border-top: none; }
.kv-k { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 9px; min-width: 0; }
.kv-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.kv-v { font-size: 13.5px; font-weight: 800; color: var(--ink); text-align: right; white-space: nowrap; flex: none; }

/* ── compare (two periods) ── */
.cmp { display: flex; align-items: center; gap: 8px; padding: 6px 14px 12px; }
.cmp-side { flex: 1; text-align: center; }
.cmp-label { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.cmp-val { font-size: 23px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; margin-top: 4px; }
.cmp-val.accent { color: var(--accent-deep); }
.cmp-sub { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
.cmp-arrow { flex: none; color: var(--ink-3); }
.cmp-growth { display: flex; align-items: center; justify-content: center; gap: 7px; margin: 0 14px 12px; padding: 9px; border-radius: 10px; font-size: 13.5px; font-weight: 800; }
.cmp-growth.up { color: var(--green); background: var(--tint-green); }
.cmp-growth.down { color: var(--tile-red); background: var(--tint-red); }

/* ── table ── */
.tbl { padding: 4px 14px 12px; }
.tbl-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.tbl-row > span { flex: 1; min-width: 0; }
.tbl-row > span:first-child { flex: 1.3; }
.tbl-head { border-top: none; }
.tbl-head > span { font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.tbl-foot { border-top: 2px solid var(--line-strong); }
.tbl-foot > span { font-weight: 800 !important; color: var(--ink) !important; }

/* ── split (stacked proportion) ── */
.split-body { padding: 8px 14px 12px; }
.split-bar { display: flex; height: 13px; border-radius: 999px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.split-bar > span { display: block; height: 100%; }
.split-legend { display: flex; flex-direction: column; gap: 0; margin-top: 10px; }
.split-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
.split-item:first-child { border-top: none; }
.split-key { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 9px; }
.split-val { font-size: 13.5px; font-weight: 800; color: var(--ink); white-space: nowrap; }
.split-val small { font-weight: 700; color: var(--ink-2); }

/* synthesis connectors */
.synth { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 0; }
.synth-node { display: flex; gap: 11px; position: relative; padding-bottom: 14px; }
.synth-node:last-child { padding-bottom: 0; }
.synth-rail { display: flex; flex-direction: column; align-items: center; flex: none; }
.synth-bead { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.synth-line { width: 2px; flex: 1; background: var(--line-strong); margin: 3px 0; min-height: 14px; }
.synth-tx { padding-top: 2px; }
.synth-k { font-size: 11px; font-weight: 800; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.synth-v { font-size: 13.5px; color: var(--ink); line-height: 1.45; margin-top: 2px; }
.synth-v b { font-weight: 800; }
.synth-concl {
  margin: 4px 14px 14px; padding: 12px 13px; border-radius: 12px;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  font-size: 13px; line-height: 1.5; color: var(--ink);
}
.synth-concl b { color: var(--accent-deep); }

/* ---------- Suggestion chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 2px 4px; }
.chips.scroller { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 8px; }
.chips.scroller::-webkit-scrollbar { height: 0; }
.chip {
  font-size: 13px; font-weight: 700; color: var(--accent-deep);
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--line-strong));
  padding: 9px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  transition: transform .1s, background .15s, box-shadow .15s; box-shadow: var(--shadow-sm); flex: none;
}
.chip:hover { background: var(--accent-soft); }
.chip:active { transform: scale(0.96); }
.chip.ghost { color: var(--ink-2); border-color: var(--line-strong); }

/* ---------- Composer ---------- */
.composer {
  flex: none; padding: 10px 14px 14px; background: linear-gradient(180deg, transparent, var(--canvas) 22%);
  position: relative; z-index: 20;
}
.composer-inner {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 22px;
  padding: 6px 6px 6px 8px; box-shadow: var(--shadow-md);
}
.composer-inner:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line-strong)); }
.composer textarea {
  flex: 1; border: none; outline: none; resize: none; background: transparent;
  font-family: var(--font); font-size: 14.5px; line-height: 1.4; color: var(--ink);
  padding: 9px 4px; max-height: 96px; min-height: 20px;
}
.composer textarea::placeholder { color: var(--ink-3); }
.send-btn {
  width: 40px; height: 40px; border-radius: 50%; flex: none; border: none; cursor: pointer;
  background: linear-gradient(160deg, var(--accent), var(--accent-deep)); color: #fff;
  display: grid; place-items: center; transition: transform .12s, filter .15s, opacity .15s;
  box-shadow: 0 6px 14px -5px var(--accent);
}
.send-btn:hover { filter: brightness(1.05); }
.send-btn:active { transform: scale(0.9); }
.send-btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.mic-btn { width: 40px; height: 40px; border-radius: 50%; flex: none; border: none; cursor: pointer; background: transparent; color: var(--ink-2); display: grid; place-items: center; transition: background .15s, color .15s, transform .12s; }
.mic-btn:hover { background: var(--accent-soft); color: var(--accent-deep); }
.mic-btn.live { background: var(--tile-red); color: #fff; animation: pulse 1.2s infinite; }
.composer-hint { text-align: center; font-size: 10.5px; color: var(--ink-3); margin-top: 7px; }
.byline { font-size: 11px; color: var(--ink-3); letter-spacing: 0.01em; }
.byline b { font-weight: 800; letter-spacing: -0.01em; }
.byline .b-edu { color: #000098; }
.byline .b-merge { color: #FC9C00; }
[data-theme="dark"] .byline .b-edu { color: #8A8AF0; }
.home-ind { width: 134px; height: 5px; border-radius: 999px; background: var(--ink); opacity: .25; margin: 0 auto 6px; }

/* ============================================================
   WEB VARIANT — ERP backdrop + docked panel
   ============================================================ */
.erp {
  width: 1080px; height: 760px; border-radius: 16px; overflow: hidden; flex: none;
  background: #eef1f6; box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
  border: 1px solid #dfe3ea;
}
.browserbar {
  height: 44px; flex: none; background: #e7e9ee; border-bottom: 1px solid #d8dce3;
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
}
.lights { display: flex; gap: 7px; }
.lights i { width: 12px; height: 12px; border-radius: 999px; }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.urlbar {
  flex: 1; max-width: 460px; height: 28px; background: #fff; border-radius: 8px;
  display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.5px; color: #6b7280;
  border: 1px solid #dde1e8;
}
.erp-body { flex: 1; display: flex; min-height: 0; }

/* ERP sidebar (backdrop) */
.erp-side {
  width: 220px; flex: none; background: #20262f; color: #cdd3dc; padding: 18px 14px;
  display: flex; flex-direction: column; gap: 4px;
}
.erp-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.erp-brand-mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(150deg, var(--orange), var(--orange-deep)); display: grid; place-items: center; color: #fff; font-weight: 800; }
.erp-brand-tx { font-weight: 800; font-size: 15.5px; color: #fff; letter-spacing: -0.01em; }
.erp-nav-label { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #6c7686; padding: 12px 8px 6px; }
.erp-nav { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: #aeb6c2; }
.erp-nav.active { background: rgba(242,101,34,0.16); color: #fff; }
.erp-nav .ni { opacity: .85; }

/* ERP main */
.erp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #f4f6fa; }
.erp-top { height: 60px; flex: none; background: #fff; border-bottom: 1px solid #e4e8ee; display: flex; align-items: center; gap: 16px; padding: 0 24px; }
.erp-top h2 { font-size: 17px; font-weight: 800; color: #20262f; letter-spacing: -0.01em; }
.erp-top .spacer { flex: 1; }
.erp-search { width: 240px; height: 36px; background: #f1f3f7; border-radius: 9px; display: flex; align-items: center; gap: 9px; padding: 0 12px; font-size: 13px; color: #9aa2af; }
.erp-content { flex: 1; padding: 22px 24px; overflow: hidden; }
.erp-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.kpi { background: #fff; border: 1px solid #e7eaf0; border-radius: 13px; padding: 15px 16px; }
.kpi-k { font-size: 12px; font-weight: 700; color: #8a93a1; }
.kpi-v { font-size: 24px; font-weight: 800; color: #20262f; margin-top: 6px; letter-spacing: -0.01em; }
.kpi-d { font-size: 12px; font-weight: 700; margin-top: 4px; }
.kpi-d.up { color: var(--green); }
.kpi-d.down { color: var(--tile-red); }
.erp-panel-block { background: #fff; border: 1px solid #e7eaf0; border-radius: 13px; margin-top: 16px; height: 250px; padding: 16px 18px; }
.erp-panel-block h3 { font-size: 14px; font-weight: 800; color: #20262f; }
.erp-bars { display: flex; align-items: flex-end; gap: 14px; height: 170px; margin-top: 18px; padding: 0 6px; }
.erp-bars .b { flex: 1; border-radius: 8px 8px 0 0; background: linear-gradient(180deg, #cdd6e6, #aab6cd); }

/* Docked copilot panel */
.copilot-dock {
  width: 396px; flex: none; background: var(--canvas); border-left: 1px solid var(--line-strong);
  display: flex; flex-direction: column; min-height: 0; box-shadow: -12px 0 30px -18px rgba(20,30,50,0.25);
}

/* FAB (web, decorative) */
.web-fab {
  position: absolute; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 18px;
  background: linear-gradient(150deg, var(--accent), var(--accent-deep)); display: grid; place-items: center;
  color: #fff; box-shadow: 0 12px 28px -8px var(--accent);
}

/* ---------- Standalone mobile experience ---------- */
.stage-mobile {
  min-height: 100vh; width: 100%;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}

/* ---------- Standalone web experience (full-screen app) ---------- */
.erp-full {
  position: fixed; inset: 0; display: flex; overflow: hidden;
  background: #eef1f6;
}
.erp-full .erp-side { width: 240px; }
.erp-full .erp-main { flex: 1; min-width: 0; }
.erp-full .copilot-dock { width: 408px; }
.erp-full .erp-content { overflow-y: auto; }
.erp-full .erp-content::-webkit-scrollbar { width: 0; }

@media (max-width: 940px) {
  .erp-full .erp-side { display: none; }
  .erp-full .copilot-dock { width: 360px; }
}
@media (max-width: 720px) {
  .erp-full .erp-main { display: none; }
  .erp-full .copilot-dock { width: 100%; border-left: none; }
}

/* ============================================================
   WEB WORKSPACE (full-screen Iris)
   ============================================================ */
.ws { position: fixed; inset: 0; display: flex; background: var(--canvas); }
/* Embedded workspace (showroom browser card) */
.ws-embed { flex: 1; min-height: 0; display: flex; background: var(--canvas); }
.ws-embed .ws-side { padding-bottom: 12px; }
.ws-embed .ws-asst .asst-scroll { padding: 22px 24px 8px; }
.ws-embed .ws-asst .composer { padding: 12px 24px 20px; }
.ws-side {
  width: 290px; flex: 0 0 290px; background: var(--surface-2); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 16px 12px 12px;
}
.ws-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 16px; }
.ws-brand .asst-avatar { width: 40px; height: 40px; border-radius: 12px; }
.ws-brand-name { font-weight: 800; font-size: 16.5px; color: var(--ink); display: flex; align-items: center; gap: 7px; letter-spacing: -0.01em; }
.brand-logo { display: block; height: 15px; width: auto; margin-top: 5px; }
.brand-logo.foot { height: 20px; margin: 0; }
[data-theme="dark"] .brand-logo { filter: brightness(1.7) saturate(1.1); }
.ws-brand-sub { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }
.ws-newchat {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; white-space: nowrap;
  padding: 11px; border-radius: 12px; font-family: var(--font); font-size: 14px; font-weight: 700; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--line-strong));
  background: var(--surface); color: var(--accent-deep); box-shadow: var(--shadow-sm);
  transition: transform .1s, background .15s;
}
.ws-newchat:hover { background: var(--accent-soft); }
.ws-newchat:active { transform: scale(0.98); }
.ws-sec { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 18px 8px 8px; }
.ws-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.ws-list::-webkit-scrollbar { width: 0; height: 0; }
.ws-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer;
  color: var(--ink-2); font-size: 13.5px; font-weight: 600; transition: background .15s; border: none; background: transparent; text-align: left;
}
.ws-item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.ws-item.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.ws-item .it-ic { flex: none; color: var(--ink-3); display: grid; place-items: center; }
.ws-item.active .it-ic { color: var(--accent-deep); }
.ws-item .it-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-badge { font-size: 10.5px; font-weight: 800; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-strong); padding: 1px 7px; border-radius: 999px; }
.ws-spacer { flex: 1; min-height: 12px; }
.ws-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.ws-usage { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 12px 13px; margin: 6px 4px 8px; }
.ws-usage-top { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.ws-usage-top .u-month { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--ink-3); }
.ws-usage .prog { margin: 10px 0 7px; }
.ws-usage-meta { font-size: 11.5px; color: var(--ink-2); }
.ws-usage-meta b { color: var(--ink); }
.ws-account { display: flex; align-items: center; gap: 10px; padding: 11px 8px 4px; border-top: 1px solid var(--line); margin-top: 8px; }
.ws-account .lrow-ava { width: 34px; height: 34px; border-radius: 10px; }
.ws-account-tx { flex: 1; min-width: 0; }
.ws-account-name { font-size: 13.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-account-role { font-size: 11.5px; color: var(--ink-2); }

/* fold toggle + collapsed rail */
.ws-side { overflow: hidden; }
.ws-fold { margin-left: auto; flex: none; width: 30px; height: 30px; border-radius: 9px; border: none; background: transparent; color: var(--ink-3); display: grid; place-items: center; cursor: pointer; transition: background .15s; }
.ws-fold:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.ws-usage-mini { display: none; }
.nc-t { white-space: nowrap; }

.ws-side.folded { width: 76px; flex-basis: 76px; padding: 16px 12px 12px; }
.ws-side.folded .ws-brand-tx,
.ws-side.folded .ws-fold,
.ws-side.folded .nc-t,
.ws-side.folded .ws-sec,
.ws-side.folded .it-t,
.ws-side.folded .ws-badge,
.ws-side.folded .ws-usage,
.ws-side.folded .ws-account-tx,
.ws-side.folded .ws-account > svg { display: none; }
.ws-side.folded .ws-brand { justify-content: center; padding: 4px 0 16px; }
.ws-side.folded .ws-newchat { padding: 11px 0; }
.ws-side.folded .ws-item { justify-content: center; padding: 10px 0; }
.ws-side.folded .ws-usage-mini { display: grid; place-items: center; height: 42px; margin: 4px 0 8px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); }
.ws-side.folded .ws-account { justify-content: center; padding: 11px 0 4px; }

.ws-main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--canvas); }
.ws-top { height: 62px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 1px solid var(--line); background: var(--surface); }
.ws-top-title { font-size: 15.5px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
.ws-top .spacer { flex: 1; }
.ws-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--green); background: var(--tint-green); padding: 6px 12px; border-radius: 999px; }
.ws-asst { flex: 1; min-height: 0; }
.ws-asst .asst-scroll { padding: 26px 26px 8px; }
.conv-col { width: 100%; }
.ws-asst .conv-col { max-width: 770px; margin: 0 auto; }
.ws-asst .composer { padding: 12px 26px 22px; background: linear-gradient(180deg, transparent, var(--canvas) 26%); }
.ws-asst .composer-inner { max-width: 770px; margin: 0 auto; }
.ws-asst .caps { grid-template-columns: 1fr 1fr; }
.ws-asst .tile-grid { grid-template-columns: repeat(3, 1fr); }

@media (max-width: 860px) {

}

/* ============================================================
   MOBILE SETTINGS SHEET
   ============================================================ */
.sheet-scrim { position: absolute; inset: 0; background: rgba(18,18,22,0.4); z-index: 60; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 90%;
  background: var(--surface-2); border-radius: 26px 26px 0 0; display: flex; flex-direction: column;
  box-shadow: 0 -12px 44px rgba(0,0,0,0.22);
}
.sheet-grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line-strong); margin: 10px auto 2px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 14px 10px 20px; }
.sheet-title { font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
.sheet-body { overflow-y: auto; padding: 4px 16px 22px; }
.sheet-body::-webkit-scrollbar { width: 0; }
.sheet-label { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 18px 6px 8px; }
.sheet-group { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm); }
.sheet-foot { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-3); padding: 22px 0 6px; }
.srow { display: flex; align-items: center; gap: 13px; padding: 13px 14px; border-top: 1px solid var(--line); cursor: pointer; background: var(--surface); transition: background .15s; }
.srow:first-child { border-top: none; }
.srow:hover { background: var(--surface-2); }
.srow-ic { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; }
